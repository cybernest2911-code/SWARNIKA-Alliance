<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#E8D48A" />
      <stop offset="100%" stop-color="#C9A84C" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#A8872A" />
    </linearGradient>
  </defs>

  <!-- Outer Border Frame -->
  <rect x="15" y="15" width="370" height="390" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  <rect x="20" y="20" width="360" height="380" rx="2" fill="none" stroke="#C9A84C" stroke-width="0.75" opacity="0.3"/>

  <!-- Geometric Tree Diagram -->
  <!-- Outer Arc -->
  <path d="M 70 230 A 130 130 0 0 1 330 230" fill="none" stroke="#C9A84C" stroke-width="2" />

  <!-- Inner Dashed Arc (Venus Arc) -->
  <path d="M 125 190 A 80 80 0 0 1 275 190" fill="none" stroke="#E8D48A" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Central Focal Diamond -->
  <polygon points="200,223 207,230 200,237 193,230" fill="#C9A84C" />

  <!-- Radial Rays / Branches from Focal Diamond -->
  <line x1="200" y1="230" x2="70" y2="230" stroke="#E8D48A" stroke-width="2" />
  <line x1="200" y1="230" x2="120" y2="170" stroke="#E8D48A" stroke-width="2" />
  <line x1="200" y1="230" x2="160" y2="125" stroke="#E8D48A" stroke-width="2" />
  <line x1="200" y1="230" x2="200" y2="100" stroke="#E8D48A" stroke-width="2.5" />
  <line x1="200" y1="230" x2="240" y2="125" stroke="#E8D48A" stroke-width="2" />
  <line x1="200" y1="230" x2="280" y2="170" stroke="#E8D48A" stroke-width="2" />
  <line x1="200" y1="230" x2="330" y2="230" stroke="#E8D48A" stroke-width="2" />

  <!-- Branch Nodes (Golden Circles) -->
  <circle cx="70" cy="230" r="7" fill="#C9A84C" />
  <circle cx="120" cy="170" r="7" fill="#C9A84C" />
  <circle cx="160" cy="125" r="7" fill="#C9A84C" />
  <circle cx="200" cy="100" r="8" fill="#C9A84C" />
  <circle cx="240" cy="125" r="7" fill="#C9A84C" />
  <circle cx="280" cy="170" r="7" fill="#C9A84C" />
  <circle cx="330" cy="230" r="7" fill="#C9A84C" />

  <!-- Trunk Line -->
  <line x1="200" y1="230" x2="200" y2="295" stroke="#E8D48A" stroke-width="3" />

  <!-- Roots branching down -->
  <line x1="200" y1="295" x2="140" y2="330" stroke="#E8D48A" stroke-width="2" />
  <line x1="200" y1="295" x2="260" y2="330" stroke="#E8D48A" stroke-width="2" />

  <!-- Root Tips Nodes -->
  <circle cx="140" cy="330" r="5" fill="#C9A84C" />
  <circle cx="260" cy="330" r="5" fill="#C9A84C" />

  <!-- Branding Text & Dividers -->
  <text x="200" y="352" text-anchor="middle" font-family="'EB Garamond', serif" font-size="20" font-weight="600" letter-spacing="7" fill="#E8D48A">SWARNIKA</text>
  
  <line x1="100" y1="360" x2="300" y2="360" stroke="#A8872A" stroke-width="1" />

  <text x="200" y="374" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="5" fill="#C9A84C">ALLIANCE</text>
  <text x="200" y="388" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7.5" font-weight="400" letter-spacing="2" fill="#A8872A">A DIVISION OF SWARNIKA INTERNATIONAL</text>
</svg>
